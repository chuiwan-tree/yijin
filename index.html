<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衣襟</title>
<style>
  body { background: #efece4; color: #2b2b2b; font: 15px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; margin: 0; padding: 18px; }
  #wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .intro { color: #555; margin: 0 0 14px; }
  #street { display: inline-flex; align-items: center; gap: 0; margin: 0 0 10px; font: 18px/32px "PingFang SC", "Hiragino Sans GB", sans-serif; background: #fbfaf5; border: 1px solid #ddd8c8; border-radius: 6px; padding: 4px 10px; flex-wrap: nowrap; }
  #street span { display: inline-block; width: 30px; text-align: center; }
  #street .end { width: auto; color: #999; font-size: 13px; padding: 0 6px; }
  #street .f { color: #c9c3b3; }
  #street .w { color: #7a96a8; }
  #street .k { color: #222; font-weight: 600; }
  #street .me { color: #9a3a10; font-weight: 700; }
  #out { font: 15px/1.6 "SF Mono", Menlo, "PingFang SC", monospace; white-space: pre-wrap; background: #fbfaf5; border: 1px solid #ddd8c8; border-radius: 6px; padding: 12px 14px; height: 40vh; overflow-y: auto; }
  #out .cmd { color: #8a5a20; }
  #out .old { color: #9a9a9a; }
  .row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row .lab { color: #777; font-size: 13px; min-width: 2.5em; }
  button { font: inherit; padding: 3px 12px; border: 1px solid #999; background: #fff; border-radius: 4px; cursor: pointer; }
  button:disabled { color: #bbb; border-color: #ddd; background: #f4f2ec; cursor: default; }
  .hint { color: #777; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>衣襟</h1>
  <p class="intro">一个小文字游戏。一个礼拜，十来分钟。</p>
  <div id="street"></div>
  <div id="out"></div>
  <div class="row" id="moves"><span class="lab">走</span></div>
  <div class="row" id="gives"><span class="lab">给</span></div>
  <div class="row" id="lets"><span class="lab">松手</span></div>
  <p class="hint"><button id="again">再开一局</button>　从舒尔茨《退休的人》来。</p>
</div>
<script src="襟.js"></script>
<script>
var out = document.getElementById('out');
var game = null;
function addText(text, cls) {
  var d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; out.appendChild(d); return d;
}
function show(text, label) {
  out.querySelectorAll('.cur').forEach(function (e) { e.classList.remove('cur'); e.classList.add('old'); });
  var first = null;
  if (label) first = addText('> ' + label, 'cmd');
  var d = addText(text + '\n\n', 'cur');
  if (!first) first = d;
  out.scrollTop = first.offsetTop - out.offsetTop - 4;
  refresh();
}
function drawStreet() {
  var s = document.getElementById('street'); s.innerHTML = '';
  function cell(t, c) { var e = document.createElement('span'); e.textContent = t; if (c) e.className = c; s.appendChild(e); }
  cell('家门', 'end');
  if (game.over) { for (var j = 0; j < L; j++) cell(j in WINDY ? '风' : '·', j in WINDY ? 'w' : 'f'); cell('门里', 'end'); return; }
  var f = followers(game);
  for (var i = 0; i < L; i++) {
    var here = KIDS.filter(function (k) { return f.indexOf(k) < 0 && game.kids[k] === i; });
    var t = '·', c = 'f';
    if (i === 0) { t = '家'; c = 'f'; }
    if (i in WINDY) { t = '风'; c = 'w'; }
    if (here.length) { t = here.length === 1 ? SHORT[here[0]] : NUM[here.length]; c = 'k'; }
    if (i === game.pos) { t = '你'; c = 'me'; }
    cell(t, c);
  }
  cell('门里', 'end');
}
function btn(parent, label, fn) {
  var b = document.createElement('button'); b.textContent = label; b.onclick = fn; parent.appendChild(b); return b;
}
function refresh() {
  drawStreet();
  var mv = document.getElementById('moves'), gv = document.getElementById('gives'), lt = document.getElementById('lets');
  [mv, gv, lt].forEach(function (r) { while (r.children.length > 1) r.removeChild(r.lastChild); });
  if (!game || game.over) return;
  ['走', '回', '等'].forEach(function (a) { btn(mv, a, function () { doit([a], a); }).disabled = (a === '回' && game.pos === 0); });
  var r = reachable(game);
  var any = false;
  r.forEach(function (k) {
    THINGS.forEach(function (th) {
      if (game.inv[th] > 0) { any = true; btn(gv, k + '·' + th, function () { doit(['给', k, th], '给 ' + k + ' ' + th); }); }
    });
  });
  if (!any) { var e = document.createElement('span'); e.className = 'lab'; e.textContent = (THINGS.some(function (t) { return game.inv[t] > 0; }) ? '够得着的人里没有' : '兜里空了'); gv.appendChild(e); }
  var f = followers(game);
  if (f.length) {
    btn(lt, f.length > 1 ? '都松手' : f[0], function () { doit(['松手'], '松手'); });
    if (f.length > 1) f.forEach(function (k) { btn(lt, k, function () { doit(['松手', k], '松手 ' + k); }); });
  } else { var e2 = document.createElement('span'); e2.className = 'lab'; e2.textContent = '没有人拽着你'; lt.appendChild(e2); }
}
function start() {
  out.innerHTML = '';
  var q = location.search.match(/seed=(\d+)/);
  game = newGame(q ? parseInt(q[1], 10) : Math.floor(Math.random() * 100000));
  show(game.opening + '\n\n' + statusText(game));
}
function doit(args, label) {
  if (!game || game.over) return;
  var text = act(game, args);
  var s = statusText(game);
  show(text + (s ? (text ? '\n\n' : '') + s : ''), label);
}
document.getElementById('again').onclick = start;
start();
</script>
</body>
</html>
